[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishbowl"
version = "0.1.0"
description = "Self-hostable, defensive-only phishing triage: parse an email, extract and defang IOCs, risk-score it, and produce an analyst-ready report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phishbowl contributors" }]
keywords = ["phishing", "triage", "security", "soc", "dfir", "email", "ioc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Runtime dependencies. Lower bounds only — Phishbowl is meant to `pip install`
# cleanly. The offline core never reaches the network; httpx is for the
# optional, key-gated enrichment layer (PRD §9).
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.7",
    "tldextract>=5.3,<6",
  "iocextract>=1.16",
    "extract-msg>=0.48",
    "pyyaml>=6",
    # iocextract imports `requests` unconditionally at module load but does not
    # declare it (its metadata lists only `regex`), so a clean install of
    # Phishbowl would otherwise break on first import with
    # `ModuleNotFoundError: No module named 'requests'`. We declare it here to
    # keep `pip install phishbowl` working; the offline core never uses it to
    # reach the network. Floor stays off the temp-file extraction CVE
    # (CVE-2026-25645, fixed in 2.33.0) and the .netrc leak (CVE-2024-47081).
    "requests>=2.33.0",
    # Security floors for transitive deps (see SECURITY.md / the one-time
    # pip-audit). Not imported directly — pinned only to keep a fresh install off
    # versions with known CVEs: `cryptography` arrives via
    # extract-msg → msoffcrypto-tool; `idna` via httpx; `urllib3` via requests
    # (PYSEC-2026-141/142 fixed in 2.7.0; earlier CVE-2025-50181/50182 redirect
    # handling and CVE-2025-66418 decompression-chain DoS).
    "cryptography>=46.0.6",
    "idna>=3.15",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
# Optional FastAPI upload UI (PRD §15 stretch). Additive only — the offline core,
# CLI, and report layer never import these; `phishbowl serve` and the web app
# fail with a clear hint if the extra isn't installed. python-multipart is what
# FastAPI uses to parse the file upload; uvicorn is the ASGI server.
web = [
    "fastapi>=0.115.6",
    "starlette>=0.47,<2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

# Dev tooling. The routine gate is `make test` (pytest) only; bandit and
# pip-audit are run once, in the dedicated security step. build is for the
# release step. No coverage plugin, no type-checker, no pre-commit (CLAUDE.md).
# Includes the web extra so the upload-UI tests run under `make test`.
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build>=1.2",
    "phishbowl[web]",
]

[project.scripts]
phishbowl = "phishbowl.cli:app"

[project.urls]
Homepage = "https://github.com/notacop38/phishbowl"
Repository = "https://github.com/notacop38/phishbowl"

[tool.hatch.build.targets.wheel]
packages = ["phishbowl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B).
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Let tests import the in-repo package without requiring an editable install,
# so the gate stays cheap even when run by an isolated tool runner.
pythonpath = ["."]
