# PhishBowl scoring configuration (PRD §8).
#
# Everything the rule engine needs to turn a parsed email into a verdict lives
# here so an analyst can tune PhishBowl to their environment WITHOUT touching
# code: rule weights, verdict bands, and the supporting lists (freemail
# providers, URL shorteners, credential-harvest keywords, urgency phrases,
# organizational-role keywords, the bundled brand-impersonation list, and
# operator org domains).
#
# This file is the *bundled default*. A site override (a second YAML file, or a
# dict passed to ``load_config``) is deep-merged on top of it, so an operator
# only has to specify the keys they want to change (see phishbowl/score/config.py).
#
# ---------------------------------------------------------------------------
# Weight & band rationale
# ---------------------------------------------------------------------------
# The score is the SUM of the weights of every rule that fired, clamped to
# 0-100 (PRD §8). Clamping (not rescaling) keeps the model transparent and
# additive: each point traces to one named rule, and adding a rule can never
# silently dilute the others. A message that fires nothing scores 0 — "few
# signals", not "safe". A rule whose weight is 0 still reports its evidence
# but adds no points (a way to observe a noisy rule without scoring it).
#
# The weights are hand-set heuristics, sanity-checked against the synthetic
# fixtures in tests/fixtures/, not calibrated against real mail:
#   * Authentication and identity forgery are the strongest single offline
#     signals (DMARC fail 18, display-name brand spoof 20, duplicate From 20).
#     A textbook header spoof (SPF+DKIM+DMARC fail plus Reply-To/Return-Path/
#     Sender divergence) reaches "High suspicion" on header signals alone.
#   * Structural attachment giveaways are strong (double extension 22, raw
#     executable 22); an "invoice.pdf.exe" trips both — deception and an
#     executable payload are separate facts — and lands at "Suspicious".
#   * Content/urgency keywords are deliberately the weakest (4): high
#     false-positive rate, so they only ever nudge a verdict, never make it.
#
# Enrichment weights (VirusTotal, urlscan, ...) live under `weights:` too,
# tagged [enrichment] in every output and only ever ADDED on top of the offline
# base. The offline verdict is always computed independently of them (PRD §8
# combination rule), so a zero-key run is unaffected.

weights:
  # --- Authentication (PRD §8) ---
  auth.spf_fail: 15
  auth.spf_softfail: 8
  auth.dkim_fail: 12
  auth.dkim_none: 5
  auth.dmarc_fail: 18
  auth.results_missing: 8

  # --- Identity / spoofing (PRD §8) ---
  identity.display_name_brand_mismatch: 20
  identity.return_path_mismatch: 10
  identity.reply_to_mismatch: 12
  identity.sender_mismatch: 8
  # A free-webmail sender presenting as an organizational role (see role_keywords).
  identity.freemail_role: 12
  identity.display_name_is_email: 8
  # RFC 5322 allows one From header; clients disagree on which of several to show.
  identity.multiple_from: 20

  # --- Domain / URL signals (PRD §8) ---
  url.punycode: 12
  url.idn_homograph: 18
  url.lookalike: 18
  url.anchor_href_mismatch: 16
  url.raw_ip_host: 12
  url.shortener: 6
  url.credential_keywords: 8
  url.wrapped_divergence: 10

  # --- Attachment risk (PRD §8) ---
  attach.macro_capable: 14
  attach.double_extension: 22
  attach.type_mismatch: 16
  attach.executable: 22
  attach.password_protected_archive: 14
  # Plain archives are a common delivery vector; weaker than password-protected
  # (which additionally evade scanning) and weaker than a raw executable.
  attach.archive: 10
  # Attached HTML/SVG pages open in a browser: credential forms, HTML smuggling.
  attach.html: 14

  # --- Weak content signals (PRD §8 — deliberately low) ---
  # Scans subject + plaintext + visible (de-tagged) HTML text.
  content.urgency_keywords: 4

  # --- Enrichment (PRD §8/§9) — only ever ADD on top of the offline base, and
  # only when the operator opts in with API keys. Each is tagged [enrichment] in
  # every output. Signals whose magnitude is "scaled" multiply the base weight by
  # a 0..1 factor the connector computes (a VirusTotal detection ratio, an
  # AbuseIPDB confidence fraction); fixed signals use the full base weight. The
  # offline verdict is always computed independently of every one of these, and
  # setting any to 0 disables that enrichment signal without touching code.
  enrichment.virustotal.detections: 45    # scaled by detection ratio
  enrichment.urlscan.malicious: 20        # a prior scan judged malicious (host-only match: half)
  enrichment.abuseipdb.confidence: 25     # scaled by abuse-confidence fraction
  enrichment.rdap.young_domain: 18        # domain registered < 30 days ago (strong)
  enrichment.shodan.exposed: 6            # exposed services on a related IP (contextual)

# Verdict bands (PRD §8). The first band whose ``max`` the score is <= wins; the
# last one MUST be 100.
bands:
  - {max: 19, verdict: "Few signals — safety undetermined"}
  - {max: 39, verdict: "Low suspicion"}
  - {max: 64, verdict: "Suspicious — analyst review"}
  - {max: 84, verdict: "High suspicion"}
  - {max: 100, verdict: "Very high suspicion"}

# Free webmail providers. A sender on one of these presenting as an
# organizational role fires identity.freemail_role; with --redact, recipient
# addresses here are hidden but the shared domain is not (it identifies no one).
# Case-insensitive.
freemail_domains:
  - gmail.com
  - googlemail.com
  - outlook.com
  - hotmail.com
  - live.com
  - yahoo.com
  - ymail.com
  - aol.com
  - icloud.com
  - me.com
  - proton.me
  - protonmail.com
  - gmx.com
  - mail.com
  - zoho.com
  - yandex.com

# URL shorteners hide the real destination (url.shortener). Matched against the
# registrable domain of a link host, case-insensitive.
url_shorteners:
  - bit.ly
  - tinyurl.com
  - goo.gl
  - t.co
  - ow.ly
  - is.gd
  - buff.ly
  - rebrand.ly
  - cutt.ly
  - rb.gy
  - shorturl.at
  - tiny.cc
  - bit.do
  - t.ly

# Substrings that, in a URL path or query, suggest credential harvesting
# (url.credential_keywords). Matched case-insensitively against path+query.
credential_keywords:
  - login
  - signin
  - sign-in
  - verify
  - verification
  - secure
  - account
  - password
  - passwd
  - credential
  - confirm
  - update
  - validate
  - authenticate
  - webscr
  - recover
  - unlock

# Urgency / financial-pressure phrases in subject or body text
# (content.urgency_keywords). Deliberately weak — high false-positive rate, so
# kept at a low weight. Matched case-insensitively.
urgency_keywords:
  - urgent
  - immediately
  - act now
  - action required
  - verify now
  - suspended
  - account locked
  - account has been locked
  - final notice
  - last warning
  - failure to comply
  - within 24 hours
  - within 48 hours
  - your account will be
  - confirm your account
  - unusual activity
  - unauthorized
  - past due
  - overdue
  - payment failed
  - wire transfer

# Organizational roles and departments (identity.freemail_role): a free-webmail
# sender whose display name claims one of these ("IT Support", "Payroll") is the
# business-email-compromise pattern. Matched as whole words, case-insensitively.
role_keywords:
  - support
  - helpdesk
  - help desk
  - service desk
  - it department
  - billing
  - invoicing
  - accounts payable
  - accounts receivable
  - finance department
  - payroll
  - human resources
  - hr department
  - security team
  - administrator
  - mail administrator
  - webmaster
  - postmaster
  - customer service
  - compliance
  - legal department

# Bundled brand-impersonation list (PRD §8). Maps a brand keyword (matched as a
# whole word or phrase in a From display name, case-insensitively) to the domains
# that legitimately belong to that brand; an empty list removes a brand in an
# override. A display name claiming the brand whose
# addr-spec domain is NOT one of these (nor a subdomain of one) fires
# identity.display_name_brand_mismatch; the same domains seed url.lookalike
# alongside any operator ``org_domains``. Brand keywords that are also common
# words or names (e.g. "chase", "apple") can match unrelated senders; prune or
# extend the list for your environment.
brands:
  microsoft: [microsoft.com, outlook.com, office.com, office365.com, live.com, microsoftonline.com]
  paypal: [paypal.com, paypal.me]
  apple: [apple.com, icloud.com, me.com]
  amazon: [amazon.com, amazon.co.uk, aws.amazon.com]
  google: [google.com, gmail.com, googlemail.com]
  netflix: [netflix.com]
  facebook: [facebook.com, fb.com]
  instagram: [instagram.com]
  linkedin: [linkedin.com]
  docusign: [docusign.com, docusign.net]
  dropbox: [dropbox.com]
  chase: [chase.com]
  wells fargo: [wellsfargo.com]
  bank of america: [bankofamerica.com, bofa.com]

# Operator-configured organization domains (PRD §12). Empty by default; a
# deployment adds its own domains (and its key vendors') so that near-miss
# typosquats of them fire url.lookalike, hosts under them are redacted as
# internal topology by --redact, and they are never sent to enrichment vendors.
# Example: [acme-corp.com, acme.io]
org_domains: []
